
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Timer & To-Do List</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 16px;
    }

    .presets {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .preset-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .preset-btn.active,
    .preset-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .custom-time {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .custom-time input {
      width: 85px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .custom-time button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: var(--text);
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .timer-display {
      font-size: 4.2rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
    }

    .active-task-banner {
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 20px;
      min-height: 22px;
    }

    .active-task-banner span {
      color: var(--text);
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-start {
      background: var(--primary);
      color: #fff;
      min-width: 140px;
    }

    .btn-reset {
      background: var(--border);
      color: var(--text);
    }

    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .todo-header h2 {
      font-size: 1.1rem;
    }

    .todo-count {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .todo-form input:focus {
      border-color: var(--primary);
    }

    .todo-form button {
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
      cursor: pointer;
    }

    .todo-item.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .todo-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-text {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Đồng Hồ Tập Trung</h1>

      <div class="presets">
        <button type="button" class="preset-btn active" data-min="30">30 phút</button>
        <button type="button" class="preset-btn" data-min="45">45 phút</button>
        <button type="button" class="preset-btn" data-min="60">60 phút</button>
        <button type="button" class="preset-btn" data-min="90">90 phút</button>
      </div>

      <div class="custom-time">
        <label for="customMinutes">Nhập số phút (≥ 30):</label>
        <input type="number" id="customMinutes" min="30" max="600" value="30" />
        <button type="button" id="applyCustomBtn">Áp dụng</button>
      </div>

      <div class="timer-display" id="timerDisplay">30:00</div>

      <div class="active-task-banner" id="activeTaskBanner">
        Chưa chọn công việc đang làm
      </div>

      <div class="controls">
        <button type="button" class="btn btn-start" id="startPauseBtn">Bắt đầu</button>
        <button type="button" class="btn btn-reset" id="resetBtn">Đặt lại</button>
      </div>
    </div>

    <div class="card">
      <div class="todo-header">
        <h2>Danh Sách Việc Cần Làm</h2>
        <span class="todo-count" id="todoCount">0/0 hoàn thành</span>
      </div>

      <form class="todo-form" id="todoForm">
        <input type="text" id="todoInput" placeholder="Nhập công việc mới..." required />
        <button type="submit">Thêm</button>
      </form>

      <ul class="todo-list" id="todoList"></ul>
    </div>
  </div>

  <script>
    let selectedMinutes = 30;
    let remainingSeconds = selectedMinutes * 60;
    let timerInterval = null;
    let isRunning = false;

    const timerDisplay = document.getElementById("timerDisplay");
    const startPauseBtn = document.getElementById("startPauseBtn");
    const resetBtn = document.getElementById("resetBtn");
    const presetBtns = document.querySelectorAll(".preset-btn");
    const customMinutesInput = document.getElementById("customMinutes");
    const applyCustomBtn = document.getElementById("applyCustomBtn");

    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      const formatted = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      timerDisplay.textContent = formatted;
      document.title = formatted + " - Focus Timer";
    }

    function pauseTimer() {
      isRunning = false;
      startPauseBtn.textContent = "Bắt đầu";
      clearInterval(timerInterval);
    }

    function setDuration(mins) {
      pauseTimer();
      selectedMinutes = Math.max(30, mins);
      remainingSeconds = selectedMinutes * 60;
      customMinutesInput.value = selectedMinutes;
      updateDisplay();
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startPauseBtn.textContent = "Tạm dừng";
      timerInterval = setInterval(function () {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          pauseTimer();
          playBeep();
          alert("Đã hết thời gian tập trung!");
        }
      }, 1000);
    }

    startPauseBtn.addEventListener("click", function () {
      if (isRunning) pauseTimer();
      else startTimer();
    });

    resetBtn.addEventListener("click", function () {
      setDuration(selectedMinutes);
    });

    presetBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        presetBtns.forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        setDuration(parseInt(btn.dataset.min, 10));
      });
    });

    function applyCustomTime() {
      const val = parseInt(customMinutesInput.value, 10);
      if (isNaN(val) || val < 30) {
        alert("Vui lòng nhập thời gian từ 30 phút trở lên.");
        customMinutesInput.value = 30;
        setDuration(30);
        return;
      }
      presetBtns.forEach(function (b) {
        b.classList.remove("active");
      });
      setDuration(val);
    }


<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo & Time Tracker</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #172033;
    }

    main {
      max-width: 640px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #17203312;
    }

    h1 { margin-top: 0; }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
    }

    button {
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    form button, .start { background: #2563eb; color: white; }
    .pause { background: #fef3c7; color: #92400e; }
    .complete { background: #dcfce7; color: #166534; }
    .delete { background: #fee2e2; color: #991b1b; }

    .todo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid #e5e7eb;
    }

    .todo-info { min-width: 0; }
    .todo-title { overflow-wrap: anywhere; }
    .todo.done .todo-title {
      color: #6b7280;
      text-decoration: line-through;
    }

    .timer {
      margin-top: 4px;
      color: #6b7280;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .empty { color: #6b7280; }

    @media (max-width: 520px) {
      .todo { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Todo List</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="Hôm nay bạn cần làm gì?" required />
      <button type="submit">Thêm</button>
    </form>
    <section id="todo-list" aria-live="polite"></section>
  </main>

  <script>
    const STORAGE_KEY = "todo-time-tracker-v1";
    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const list = document.querySelector("#todo-list");

    let todos = loadTodos();

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function elapsedMs(todo) {
      return todo.elapsedMs + (todo.startedAt ? Date.now() - todo.startedAt : 0);
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function render() {
      if (todos.length === 0) {
        list.innerHTML = '<p class="empty">Chưa có việc nào. Thêm việc đầu tiên nhé!</p>';
        return;
      }

      list.innerHTML = todos.map(todo => `
        <article class="todo ${todo.done ? "done" : ""}">
          <div class="todo-info">
            <div class="todo-title">${escapeHTML(todo.title)}</div>
            <div class="timer" data-time-id="${todo.id}">
              ${formatTime(elapsedMs(todo))}
              ${todo.startedAt ? " · Đang chạy" : ""}
            </div>
          </div>
          <div class="actions">
            ${!todo.done ? `
              <button class="${todo.startedAt ? "pause" : "start"}"
                data-action="${todo.startedAt ? "pause" : "start"}"
                data-id="${todo.id}">
                ${todo.startedAt ? "Tạm dừng" : "Bắt đầu"}
              </button>
              <button class="complete" data-action="complete" data-id="${todo.id}">
                Hoàn thành
              </button>
            ` : ""}
            <button class="delete" data-action="delete" data-id="${todo.id}">
              Xóa
            </button>
          </div>
        </article>
      `).join("");
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      todos.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        elapsedMs: 0,
        startedAt: null,
        done: false
      });

      input.value = "";
      saveTodos();
      render();
    });

    list.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const todo = todos.find(item => item.id === button.dataset.id);
      if (!todo) return;
      switch (button.dataset.action) {
        case "start":
          // Chỉ chạy một đồng hồ tại một thời điểm.
          todos.forEach(item => {
            if (item.startedAt) {
              item.elapsedMs += Date.now() - item.startedAt;
              item.startedAt = null;
            }
          });
          todo.startedAt = Date.now();
          break;

        case "pause":
          todo.elapsedMs += Date.now() - todo.startedAt;
          todo.startedAt = null;
          break;

        case "complete":
          if (todo.startedAt) {
            todo.elapsedMs += Date.now() - todo.startedAt;
            todo.startedAt = null;
          }
          todo.done = true;
          break;

        case "delete":
          todos = todos.filter(item => item.id !== todo.id);
          break;
      }

      saveTodos();
      render();
    });

    // Cập nhật phần hiển thị đồng hồ mà không dựng lại toàn bộ danh sách.
    setInterval(() => {
      todos.forEach(todo => {
        if (!todo.startedAt) return;
        const timer = document.querySelector(`[data-time-id="${todo.id}"]`);
        if (timer) timer.textContent = `${formatTime(elapsedMs(todo))} · Đang chạy`;
      });
    }, 1000);

    render();
  </script>
</body>
</html>
