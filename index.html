<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Focus Timer</title>

  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --green: #059669;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 8px 26px rgb(15 23 42 / 6%);
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.4rem;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .preset-button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #f8fafc;
      color: var(--text);
    }

    .preset-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .custom-time {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 18px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .custom-time input {
      width: 86px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      text-align: center;
    }

    .custom-time button,
    .add-button {
      padding: 9px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .custom-time button:hover,
    .add-button:hover,
    .start-button:hover {
      background: var(--primary-dark);
    }

    .timer-display {
      margin: 14px 0;
      color: var(--primary);
      font-size: clamp(3.5rem, 18vw, 5rem);
      font-weight: 750;
      letter-spacing: 2px;
      line-height: 1.1;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .active-task {
      min-height: 24px;
      margin-bottom: 18px;
      color: var(--muted);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .active-task strong {
      color: var(--text);
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .timer-controls button {
      min-width: 125px;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      font-weight: 650;
    }

    .start-button {
      background: var(--primary);
      color: white;
    }

    .reset-button {
      background: var(--border);
      color: var(--text);
    }

    .todo-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .todo-heading h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .todo-count {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-form input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .todo-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fafafa;
    }

    .todo-item.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .todo-checkbox {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      accent-color: var(--green);
    }

    .todo-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .select-button,
    .delete-button {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .select-button {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .todo-item.selected .select-button {
      background: #bfdbfe;
    }

    .delete-button {
      background: #fee2e2;
      color: var(--danger);
      font-size: 1rem;
    }

    .empty-state {
      padding: 16px 4px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 420px) {
      .card {
        padding: 18px;
      }

      .todo-item {
        flex-wrap: wrap;
      }

      .todo-text {
        width: calc(100% - 35px);
      }

      .select-button {
        margin-left: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card" aria-labelledby="timer-heading">
      <h1 id="timer-heading">Đồng Hồ Tập Trung</h1>

      <div class="presets" aria-label="Thời lượng có sẵn">
        <button class="preset-button active" type="button" data-minutes="30">30 phút</button>
        <button class="preset-button" type="button" data-minutes="45">45 phút</button>
        <button class="preset-button" type="button" data-minutes="60">60 phút</button>
        <button class="preset-button" type="button" data-minutes="90">90 phút</button>
      </div>

      <div class="custom-time">
        <label for="custom-minutes">Tùy chỉnh (30–600 phút):</label>
        <input id="custom-minutes" type="number" min="30" max="600" value="30">
        <button id="apply-time" type="button">Áp dụng</button>
      </div>

      <div class="timer-display" id="timer-display" role="timer">30:00</div>

      <p class="active-task" id="active-task" aria-live="polite">
        Chưa chọn công việc đang làm
      </p>

      <div class="timer-controls">
        <button class="start-button" id="start-pause" type="button">Bắt đầu</button>
        <button class="reset-button" id="reset-timer" type="button">Đặt lại</button>
      </div>
    </section>

    <section class="card" aria-labelledby="todo-heading">
      <div class="todo-heading">
        <h2 id="todo-heading">Danh Sách Việc Cần Làm</h2>
        <span class="todo-count" id="todo-count">0/0 hoàn thành</span>
      </div>

      <form class="todo-form" id="todo-form">
        <input
          id="todo-input"
          type="text"
          maxlength="200"
          placeholder="Nhập công việc mới..."
          autocomplete="off"
          required
        >
        <button class="add-button" type="submit">Thêm</button>
      </form>

      <ul class="todo-list" id="todo-list"></ul>
    </section>
  </main>

  <script>
    // Đồng hồ đếm ngược
    let selectedMinutes = 30;
    let remainingSeconds = selectedMinutes * 60;
    let timerInterval = null;
    let endTime = null;

    const timerDisplay = document.getElementById("timer-display");
    const startPauseButton = document.getElementById("start-pause");
    const customMinutesInput = document.getElementById("custom-minutes");
    const presetButtons = document.querySelectorAll(".preset-button");

    function updateTimerDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;

      timerDisplay.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

      document.title = timerDisplay.textContent + " - Focus Timer";
    }

    function pauseTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      if (endTime !== null) {
        remainingSeconds = Math.max(
          0,
          Math.ceil((endTime - Date.now()) / 1000)
        );
      }

      endTime = null;
      startPauseButton.textContent =
        remainingSeconds < selectedMinutes * 60 ? "Tiếp tục" : "Bắt đầu";

      updateTimerDisplay();
    }

    function playAlarm() {
      try {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        const audioContext = new AudioContextClass();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 880;
        gain.gain.value = 0.25;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.6);
        oscillator.onended = () => audioContext.close();
      } catch (error) {
        // Âm thanh có thể không khả dụng trên một số trình duyệt.
      }
    }

    function startTimer() {
      if (timerInterval !== null || remainingSeconds <= 0) return;

      endTime = Date.now() + remainingSeconds * 1000;
      startPauseButton.textContent = "Tạm dừng";

      timerInterval = setInterval(() => {
        remainingSeconds = Math.max(
          0,
          Math.ceil((endTime - Date.now()) / 1000)
        );

        updateTimerDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          endTime = null;
          startPauseButton.textContent = "Bắt đầu";
          playAlarm();
          alert("Đã hết thời gian tập trung!");
        }
      }, 250);
    }

    function setDuration(minutes) {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
      }

      timerInterval = null;
      endTime = null;
      selectedMinutes = minutes;
      remainingSeconds = minutes * 60;
      customMinutesInput.value = minutes;
      startPauseButton.textContent = "Bắt đầu";

      presetButtons.forEach((button) => {
        button.classList.toggle(
          "active",
          Number(button.dataset.minutes) === minutes
        );
      });

      updateTimerDisplay();
    }

    startPauseButton.addEventListener("click", () => {
      if (timerInterval !== null) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    document.getElementById("reset-timer").addEventListener("click", () => {
      setDuration(selectedMinutes);
    });

    presetButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setDuration(Number(button.dataset.minutes));
      });
    });

    function applyCustomDuration() {
      const minutes = Number(customMinutesInput.value);

      if (!Number.isInteger(minutes) || minutes < 30 || minutes > 600) {
        alert("Nhập số phút từ 30 đến 600 nhé.");
        customMinutesInput.focus();
        return;
      }

      setDuration(minutes);
    }

    document.getElementById("apply-time").addEventListener("click", applyCustomDuration);

    customMinutesInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        applyCustomDuration();
      }
    });

    // Danh sách việc cần làm: lưu trong trình duyệt.
    const STORAGE_KEY = "focus-timer-todo-v1";
    const todoForm = document.getElementById("todo-form");
    const todoInput = document.getElementById("todo-input");
    const todoList = document.getElementById("todo-list");
    const todoCount = document.getElementById("todo-count");
    const activeTask = document.getElementById("active-task");

    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

        if (!Array.isArray(saved)) return [];

        return saved
          .filter((todo) => todo && typeof todo.text === "string")
          .map((todo) => ({
            id: String(todo.id || Date.now() + Math.random()),
            text: todo.text,
            completed: Boolean(todo.completed),
            selected: Boolean(todo.selected)
          }));
      } catch (error) {
        return [];
      }
    }

    let todos = loadTodos();

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (error) {
        // Danh sách vẫn dùng được nếu bộ nhớ trình duyệt không khả dụng.
      }
    }

    function renderTodos() {
      todoList.replaceChildren();

      const completedCount = todos.filter((todo) => todo.completed).length;
      todoCount.textContent = `${completedCount}/${todos.length} hoàn thành`;

      const selectedTodo = todos.find((todo) => todo.selected && !todo.completed);
      activeTask.replaceChildren();

      if (selectedTodo) {
        activeTask.append("Đang làm: ");
        const taskName = document.createElement("strong");
        taskName.textContent = selectedTodo.text;
        activeTask.appendChild(taskName);
      } else {
        activeTask.textContent = "Chưa chọn công việc đang làm";
      }

      if (todos.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "Chưa có công việc nào. Hãy thêm việc mới!";
        todoList.appendChild(empty);
        return;
      }

      todos.forEach((todo) => {
        const item = document.createElement("li");
        item.className = "todo-item";
        item.classList.toggle("selected", todo.selected && !todo.completed);
        item.classList.toggle("completed", todo.completed);

        const checkbox = document.createElement("input");
        checkbox.className = "todo-checkbox";
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", "Đánh dấu hoàn thành");

        checkbox.addEventListener("change", () => {
          todo.completed = checkbox.checked;

          if (todo.completed) {
            todo.selected = false;
          }

          saveTodos();
          renderTodos();
        });

        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = todo.text;

        const selectButton = document.createElement("button");
        selectButton.className = "select-button";
        selectButton.type = "button";
        selectButton.textContent =
          todo.selected && !todo.completed ? "Đang làm" : "Chọn";
        selectButton.disabled = todo.completed;

        selectButton.addEventListener("click", () => {
          if (todo.completed) return;

          todos.forEach((otherTodo) => {
            otherTodo.selected = otherTodo.id === todo.id;
          });

          saveTodos();
          renderTodos();
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "Xóa";
        deleteButton.setAttribute("aria-label", "Xóa công việc");

        deleteButton.addEventListener("click", () => {
          todos = todos.filter((otherTodo) => otherTodo.id !== todo.id);

          if (!todos.some((otherTodo) => otherTodo.selected)) {
            const nextTodo = todos.find((otherTodo) => !otherTodo.completed);
            if (nextTodo) nextTodo.selected = true;
          }

          saveTodos();
          renderTodos();
        });

        item.append(checkbox, text, selectButton, deleteButton);
        todoList.appendChild(item);
      });
    }

    todoForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = todoInput.value.trim();
      if (!text) return;

      const hasActiveTask = todos.some(
        (todo) => todo.selected && !todo.completed
      );

      todos.push({
        id: `${Date.now()}-${Math.random()}`,
        text,
        completed: false,
        selected: !hasActiveTask
      });

      todoInput.value = "";
      saveTodos();
      renderTodos();
      todoInput.focus();
    });

    if (!todos.some((todo) => todo.selected && !todo.completed)) {
      const firstIncomplete = todos.find((todo) => !todo.completed);
      if (firstIncomplete) firstIncomplete.selected = true;
    }

    saveTodos();
    updateTimerDisplay();
    renderTodos();
  </script>
</body>
</html>
